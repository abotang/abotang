<svg xmlns="http://www.w3.org/2000/svg" width="470" height="222" viewBox="0 0 470 222" role="img">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#070b14"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#7cf7ca"/><stop offset=".55" stop-color="#78caff"/><stop offset="1" stop-color="#bb9cff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#478c9a" stop-opacity=".25"/><stop offset="1" stop-color="#101927" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 H 0 V 36" fill="none" stroke="#b0c9e5" stroke-opacity=".045"/></pattern>
</defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif}.mono{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}.muted{fill:#93a5bd}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none!important}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.4}}.orbit{transform-origin:770px 218px;animation:spin 36s linear infinite}.pulse{animation:breathe 3s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="20" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="20" fill="url(#grid)"/>
